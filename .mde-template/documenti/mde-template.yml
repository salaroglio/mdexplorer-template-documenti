mde_template: 2
id: documenti
kind: foundation
title: Document Driven Development
description: "The project's wiki, written and kept in order with the agents: the sources stay untouched, the pages grow, the index and the log say what is there and what changed."
version: 2.0.0
requires:
  mde: 2026.10.21.2
languages:
  it: { structure: main, example: esempio }
  en: { structure: en, example: example }
instructions: .mde-template/documenti/instructions.md
slides:
  en: .mde-template/documenti/presentation.md
theory:
  en: { from: .mde-template/documenti/theory, to: theory/documenti }
seeds:
  - { from: .mde-template/documenti/seeds/sources.md, to: sources/README.md }
  - { from: .mde-template/documenti/example/wiki/index.md, to: wiki/index.md }
  - { from: .mde-template/documenti/example/wiki/log.md, to: wiki/log.md }
  - { from: .mde-template/documenti/seeds/reviews.md, to: reviews/README.md }
  - { from: .mde-template/documenti/example/sources/minutes-2027-03-12.md, to: sources/minutes-2027-03-12.md }
  - { from: .mde-template/documenti/example/sources/email-2027-03-20-go-live.md, to: sources/email-2027-03-20-go-live.md }
  - { from: .mde-template/documenti/example/wiki/nordica-crediti.md, to: wiki/nordica-crediti.md }
  - { from: .mde-template/documenti/example/wiki/debt-collection-portal.md, to: wiki/debt-collection-portal.md }
  - { from: .mde-template/documenti/example/wiki/source-minutes-2027-03-12.md, to: wiki/source-minutes-2027-03-12.md }
  - { from: .mde-template/documenti/example/wiki/source-email-2027-03-20-go-live.md, to: wiki/source-email-2027-03-20-go-live.md }
  - { from: .mde-template/documenti/example/reviews/review-2027-03-21.md, to: reviews/review-2027-03-21.md }
skills:
  - .mde-template/documenti/skills/documenti-wiki
agent_city:
  roles:
    - { role: Documentation owner, description: "approves the wiki pages and the checks, and decides what gets fixed", agents: [documenti-editor, documenti-reviewer, documenti-librarian] }
  workflows:
    - .mde-template/documenti/workflows/source.md
    - .mde-template/documenti/workflows/check.md
